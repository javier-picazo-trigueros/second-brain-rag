# Ejemplo FICTICIO del mapa de alias. Cópialo a `data/aliases.toml` (esa carpeta está ignorada por
# git) y ajústalo a las carpetas de tu vault.
#
# La asignatura de una nota es su carpeta de segundo nivel (`curso/ASIGNATURA/...`). Cada carpeta
# funciona sola con su propio nombre; este fichero solo hace falta cuando hablas de otra manera.
#
#   aliases  = cómo nombras la asignatura al preguntar (sin mayúsculas ni acentos).
#   folders  = carpetas de asignatura que forman esta (se fusionan aunque cambie la mayúscula
#              o el curso).
#   include  = fragmentos de ruta extra, para notas sueltas guardadas en otra carpeta.

[subjects."Álgebra Lineal"]
aliases = ["álgebra lineal", "algebra", "algebra lineal"]
folders = ["ALGEBRA"]

[subjects."Estructuras de Datos"]
aliases = ["estructuras de datos", "eda"]
folders = ["Estructuras"]
include = ["Optativas/Estructuras - "]   # notas de esta asignatura guardadas en otra carpeta

# Dos asignaturas con nombres casi iguales: el número tiene que coincidir exacto («IA II» nunca
# se confunde con «IA I»), aunque una palabra larga lleve una falta («inteligencia artificicial»).
[subjects."Inteligencia Artificial I"]
aliases = ["ia i", "ia 1", "inteligencia artificial i", "inteligencia artificial 1"]
folders = ["IA1"]

[subjects."Inteligencia Artificial II"]
aliases = ["ia ii", "ia 2", "inteligencia artificial ii", "inteligencia artificial 2"]
folders = ["IA2"]

# Un `include` MUEVE la nota: estas unidades están guardadas dentro de la carpeta IA2, pero son de
# otra asignatura, y por eso ya no cuentan como notas de Inteligencia Artificial II.
[subjects."Data Mining"]
aliases = ["data mining", "minería de datos"]
folders = ["DM"]
include = ["ia2 dm"]   # fragmento de ruta normalizado (minúsculas, sin acentos ni signos)
