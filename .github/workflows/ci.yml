name: CI

# Sin Ollama ni Qdrant: solo pruebas unitarias (las de integración se saltan solas y aquí se excluyen),
# calidad del código, la interfaz y la auditoría de privacidad (sin manifest omite lo del vault).
on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.11, Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # la auditoría de privacidad mira el historial no publicado
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar dependencias
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests
      - name: Mypy (estricto)
        run: python -m mypy
      - name: Pruebas unitarias con cobertura de ingest/ y retrieval/
        run: >
          python -m pytest -m "not integration" -q
          --cov=secondbrain.ingest --cov=secondbrain.retrieval
          --cov-report=term-missing:skip-covered --cov-fail-under=85
      - name: Auditoría de privacidad
        run: python -m secondbrain.privacy_audit

  frontend:
    name: Interfaz (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Quitar el .npmrc local (rutas de Windows para sacar node_modules de OneDrive)
        run: rm -f .npmrc
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm typecheck
      - name: ESLint
        run: pnpm lint
      - name: Vitest
        run: pnpm test
